version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aira-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${DB_NAME:-aira}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aira}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aira-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aira-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aira-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  aira:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aira-app
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-aira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}
      DB_NAME: ${DB_NAME:-aira}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-3.5-turbo}
      NEWS_API_KEY: ${NEWS_API_KEY}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aira-network
    restart: unless-stopped
    healthcheck:
      disable: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  aira-network:
    driver: bridge
